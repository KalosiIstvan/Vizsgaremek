<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belépés – Füst &amp; Parázs</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  nav.main-nav { position: sticky; top: 0; z-index: 100; background: rgba(23,26,29,.95); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,.1); }
  .nav-container { display: flex; align-items: center; justify-content: space-between; padding: 12px 22px; max-width: 1240px; margin: 0 auto; flex-wrap: wrap; }
  .nav-links { display: flex; gap: 12px; list-style: none; align-items: center; margin: 0; padding: 0; }
  .nav-links li a { color: var(--chalk); text-decoration: none; font-weight: 500; font-size: 0.95rem; padding: 8px 12px; border-radius: 6px; transition: background 0.2s; }
  .nav-links li a:hover { background: rgba(255,255,255,.12); }
  .auth-buttons { display: flex; gap: 10px; align-items: center; }
  .btn-login { color: var(--chalk); text-decoration: none; font-weight: 600; font-size: 0.95rem; padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.3); transition: background 0.2s; }
  .btn-login:hover { background: rgba(255,255,255,.1); }
  .btn-register { background: var(--mustard); color: var(--ink); text-decoration: none; font-weight: 700; font-size: 0.95rem; padding: 8px 16px; border-radius: 999px; transition: transform 0.2s; }
  .btn-register:hover { transform: translateY(-2px); }
  .hamburger { display: none; background: none; border: none; cursor: pointer; flex-direction: column; gap: 5px; padding: 5px; }
  .hamburger span { display: block; width: 25px; height: 3px; background-color: var(--chalk); border-radius: 3px; transition: 0.3s; }
  @media (max-width: 1100px) {
    .nav-links { display: none; width: 100%; flex-direction: column; order: 4; background: var(--ink); padding: 15px 0; border-radius: 0 0 10px 10px; }
    .main-nav.open .nav-links { display: flex; }
    .auth-buttons { order: 2; margin-left: auto; margin-right: 15px; }
    .hamburger { display: flex; order: 3; }
  }
</style>
</head>
<body>

<nav class="main-nav" aria-label="Főmenü">
  <div class="nav-container">
    <a class="logo" href="index.html">Füst &amp; Parázs</a>
    <ul id="navlist" class="nav-links">
      <li><a href="index.html">Főoldal</a></li>
      <li><a href="index.html#modszerek">Módszerek</a></li>
      <li><a href="index.html#homerseklet">Hőfokok</a></li>
      <li><a href="recept.html">Receptek</a></li>
      <li><a href="helyek.html">Helyek térképen</a></li>
    </ul>
    <div class="auth-buttons" id="auth-nav">
      <a href="belepes.html" class="btn-login">Belépés</a>
      <a href="regisztracio.html" class="btn-register">Regisztráció</a>
    </div>
    <button id="navbtn" class="hamburger" aria-expanded="false" aria-controls="navlist">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<header class="hero" style="padding: 40px 0; border-bottom: 4px solid var(--mustard);">
  <div class="wrap">
    <h1 style="font-size: clamp(2rem, 6vw, 3.5rem); text-shadow: none; background: none; -webkit-background-clip: unset; color: var(--mustard);">Belépés</h1>
    <p class="lead" style="max-width: 600px;">Jelentkezz be a fiókodba, hogy értékelhess és helyeket tölthess fel.</p>
  </div>
</header>

<main style="padding: 60px 0; min-height: 70vh; background: var(--chalk);">
  <div class="wrap">
    <div class="panel" style="max-width: 460px; margin: 0 auto; padding: 34px;">
      <h3 style="color: var(--teal); margin-bottom: 20px;">Fiókba belépés</h3>

      <form class="regform" id="form-login" onsubmit="return false">
        <label class="full">E-mail cím *<input type="email" id="login-email" placeholder="istvan@example.com" required></label>
        <label class="full">Jelszó *<input type="password" id="login-pass" placeholder="••••••••" required></label>
        <button class="btn full" type="button" id="btn-login" style="margin-top: 15px;">Belépés</button>
      </form>

      <p id="login-msg" class="apimsg" style="display:none; margin-top: 14px; color: var(--brick); font-weight: bold;"></p>

      <p class="note" style="margin-top: 20px; font-size: 0.88rem;">Még nincs fiókod? <a href="regisztracio.html" style="color: var(--teal); font-weight: 700;">Regisztrálj itt</a>.</p>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <p>Füst &amp; Parázs • <span id="ev"></span></p>
  </div>
</footer>

<script src="js/app.js"></script>
<script>
  document.getElementById('ev').textContent = new Date().getFullYear();
  
  const btn = document.getElementById('navbtn');
  const nav = document.querySelector('.main-nav');
  btn.addEventListener('click', function () {
    nav.classList.toggle('open');
    btn.setAttribute('aria-expanded', nav.classList.contains('open'));
  });

  const user = JSON.parse(localStorage.getItem('fp_user') || 'null');
  const authNav = document.getElementById('auth-nav');
  if (user) {
    authNav.innerHTML = `<span style="color:var(--chalk); font-weight:600; font-size:0.9rem; margin-right:5px;">Szia, ${user.nev.split(' ')[0]}!</span><a href="#" id="logout-btn" class="btn-login" style="background:var(--brick); border:none;">Kilépés</a>`;
    document.getElementById('logout-btn').addEventListener('click', function(e) { e.preventDefault(); localStorage.removeItem('fp_user'); window.location.reload(); });
  }

  document.getElementById('btn-login').addEventListener('click', function () {
    var email = document.getElementById('login-email').value.trim();
    var pass  = document.getElementById('login-pass').value;
    var msg   = document.getElementById('login-msg');

    if (!email || !pass) {
      msg.style.display = 'block';
      msg.textContent = 'Töltsd ki mindkét mezőt.';
      return;
    }

    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, jelszo: pass })
    })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok) {
        msg.style.display = 'block';
        msg.textContent = res.j.error || 'Hibás email vagy jelszó.';
        return;
      }
      localStorage.setItem('fp_user', JSON.stringify(res.j.user));
      window.location.href = 'index.html';
    })
    .catch(function () {
      var users = JSON.parse(localStorage.getItem('fp_users') || '[]');
      var user = users.find(function (u) { return u.email === email && u.jelszo === pass; });
      if (!user) {
        msg.style.display = 'block';
        msg.textContent = 'Hibás email vagy jelszó (demó mód).';
        return;
      }
      localStorage.setItem('fp_user', JSON.stringify(user));
      window.location.href = 'index.html';
    });
  });
</script>
</body>
</html>
